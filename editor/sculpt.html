        };
        const posVals = {
            x: document.getElementById('pos-x-val'),
            y: document.getElementById('pos-y-val'),
            z: document.getElementById('pos-z-val'),
        };
        const scaleVals = {
            x: document.getElementById('scale-x-val'),
            y: document.getElementById('scale-y-val'),
            z: document.getElementById('scale-z-val'),
        };

        function updateTransformDisplay() {
            posVals.x.textContent = parseFloat(posSliders.x.value).toFixed(1);
            posVals.y.textContent = parseFloat(posSliders.y.value).toFixed(1);
            posVals.z.textContent = parseFloat(posSliders.z.value).toFixed(1);
            scaleVals.x.textContent = parseFloat(scaleSliders.x.value).toFixed(2);
            scaleVals.y.textContent = parseFloat(scaleSliders.y.value).toFixed(2);
            scaleVals.z.textContent = parseFloat(scaleSliders.z.value).toFixed(2);
        }

        function loadTransformSliders() {
            const t = partTransforms[activePart];
            if (!t) return;
            posSliders.x.value = t.pos.x;
            posSliders.y.value = t.pos.y;
            posSliders.z.value = t.pos.z;
            scaleSliders.x.value = t.scale.x;
            scaleSliders.y.value = t.scale.y;
            scaleSliders.z.value = t.scale.z;
            updateTransformDisplay();
        }

        function applyTransform() {
            const t = partTransforms[activePart];
            if (!t) return;
            t.pos.x = parseFloat(posSliders.x.value);
            t.pos.y = parseFloat(posSliders.y.value);
            t.pos.z = parseFloat(posSliders.z.value);
            t.scale.x = parseFloat(scaleSliders.x.value);
            t.scale.y = parseFloat(scaleSliders.y.value);
            t.scale.z = parseFloat(scaleSliders.z.value);
            updateAllTransforms();
            updateTransformDisplay();
            updateJoints();
        }

        for (const s of Object.values(posSliders)) s.addEventListener('input', applyTransform);
        for (const s of Object.values(scaleSliders)) s.addEventListener('input', applyTransform);

        document.getElementById('entity-name')?.addEventListener('change', () => readEntityName());
        document.getElementById('entity-name')?.addEventListener('blur', () => readEntityName());

        // ------------------------------------------------------------------
        // 10. Tools
        // ------------------------------------------------------------------
        const btnPencil = document.getElementById('btn-pencil');
        const btnEraser = document.getElementById('btn-eraser');
        const btnFill = document.getElementById('btn-fill');
        const btnEyedrop = document.getElementById('btn-eyedrop');
        function setTool(newTool) {
            tool = newTool;
            btnPencil.classList.toggle('active-tool', tool === 'pencil');
            btnEraser.classList.toggle('active-tool', tool === 'eraser');
            btnFill.classList.toggle('active-tool', tool === 'fill');
            btnEyedrop.classList.toggle('active-tool', tool === 'eyedrop');
            const colors = {
                pencil: [0x88ccff, 0x4488ff],
                eraser: [0xff6666, 0xff4444],
                fill: [0x66ffaa, 0x22aa66],
                eyedrop: [0xffdd66, 0xccaa22],
            };
            const [col, em] = colors[tool] || colors.pencil;
            cursorMat.color.setHex(col);
            cursorMat.emissive.setHex(em);
        }
        btnPencil.addEventListener('click', () => setTool('pencil'));
        btnEraser.addEventListener('click', () => setTool('eraser'));
        btnFill.addEventListener('click', () => setTool('fill'));
        btnEyedrop.addEventListener('click', () => setTool('eyedrop'));
        document.getElementById('btn-kind-character').addEventListener('click', () => {
            if (currentPreset.kind === 'object' || PART_ORDER.length === 0) {
                applyCreaturePreset(getPreset('biped'));
            }
            setEntityKind('character');
        });
        document.getElementById('btn-kind-object').addEventListener('click', () => setEntityKind('object'));
        document.getElementById('sel-object-size').addEventListener('change', (e) => {
            const n = parseInt(e.target.value, 10);
            objectGrid.x = n;
            objectGrid.z = n;
            // Drop voxels outside the new footprint.
            objectVoxels = objectVoxels.filter((v) => inObjectBounds(v.x, v.y, v.z));
            rebuildBoundsMarkers(n, n);
            rebuildObjectMeshes();
        });
        document.getElementById('sel-object-height').addEventListener('change', (e) => {
            objectGrid.y = parseInt(e.target.value, 10);
            objectVoxels = objectVoxels.filter((v) => inObjectBounds(v.x, v.y, v.z));
            rebuildObjectMeshes();
        });
        document.getElementById('btn-new').addEventListener('click', () => {
            if (!confirm(entityKind === 'object'
                ? '¿Vaciar el objeto actual?'
                : '¿Resetear el personaje al modelo base?')) return;
            if (entityKind === 'object') {
                objectVoxels = [{ x: 0, y: 0, z: 0, c: colorIndex }];
                rebuildObjectMeshes();
            } else {
                const fresh = generateBaseVoxels();
                for (const name of PART_ORDER) partVoxels[name] = fresh[name];
                for (const name of PART_ORDER) {
                    partTransforms[name] = { pos: { x: 0, y: 0, z: 0 }, scale: { x: 1, y: 1, z: 1 } };
                    rebuildPart(name);
                }
                resetJoints();
                updateAllTransforms();
                setActivePart(PART_ORDER[0] || 'torso');
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'b' || e.key === 'B') setTool('pencil');
            if (e.key === 'd' || e.key === 'D') setTool('eraser');
            if (e.key === 'f' || e.key === 'F') setTool('fill');
            if (e.key === 'i' || e.key === 'I' || e.key === 'g' || e.key === 'G') setTool('eyedrop');
            if (e.key >= '1' && e.key <= '9') setColorIndex(parseInt(e.key, 10) - 1);
            if (e.key === '0') setColorIndex(9);
        });

        // ------------------------------------------------------------------
        // 11. Walk
        // ------------------------------------------------------------------
        const btnWalk = document.getElementById('btn-walk');
        btnWalk.addEventListener('click', () => {
            walkActive = !walkActive;
            btnWalk.classList.toggle('active', walkActive);
        });

        function animateWalk(delta) {
            if (!walkActive || entityKind !== 'character' || !currentPreset.hasWalk) return;
            walkTime += delta;
            if (typeof currentPreset.walk === 'function') {
                currentPreset.walk(jointRotations, walkTime);
            }
            updateJoints();
            updateRotationSlidersValues();
        }

        // ------------------------------------------------------------------
        // 12. Reset
        // ------------------------------------------------------------------
        document.getElementById('btn-reset').addEventListener('click', () => {
            walkActive = false;
            btnWalk.classList.remove('active');
            resetJoints();
            for (const name of PART_ORDER) {
                partTransforms[name].pos = { x: 0, y: 0, z: 0 };
                partTransforms[name].scale = { x: 1, y: 1, z: 1 };
            }
            updateAllTransforms();
            loadTransformSliders();
            setActivePart(activePart);
        });

        // ------------------------------------------------------------------
        // 13. Export / import (parts + local voxels + animation)
        // ------------------------------------------------------------------
        function exportModel() {
            const id = readEntityName();
            let data;
            if (entityKind === 'object') {
                data = {
                    version: '1.0',
                    kind: 'object',
                    preset: 'object',
                    id,
                    grid: { ...objectGrid },
                    palette: paletteName,
                    voxels: objectVoxels.map((v) => ({ x: v.x, y: v.y, z: v.z, c: v.c })),
                };
            } else {
                const g = charGrid();
                data = {
                    version: '1.0',
                    kind: 'character',
                    preset: currentPreset.id,
                    id,
                    grid: { ...g },
                    torso_y: PART_CONFIG.torso?.pivot?.y ?? 20,
                    palette: paletteName,
                    parts: {},
                    animation: { ...jointRotations },
                };
                for (const name of PART_ORDER) {
                    const cfg = PART_CONFIG[name];
                    data.parts[name] = {
                        parent: cfg.parent,
                        offset: {
                            x: groupBaseOffset(name).x,
                            y: groupBaseOffset(name).y,
                            z: groupBaseOffset(name).z,
                        },
                        transform: structuredClone(partTransforms[name]),
                        voxels: partVoxels[name].map((v) => ({
                            x: v.x, y: v.y, z: v.z, c: v.c,
                        })),
                    };
                }
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${id}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function groupBaseOffset(name) {
            return partGroups[name].userData.basePos;
        }

        function importModel(jsonData) {
            try {
                const data = JSON.parse(jsonData);
                // Archivo de animación (fotogramas en segundos + modelo referido).
                if (data.kind === 'animation' || (Array.isArray(data.frames) && data.model)) {
                    loadAnimClip(data);
                    return;
                }
                if (data.palette && PALETTES[data.palette]) {
                    paletteName = data.palette;
                    palette = PALETTES[data.palette];
                    selPalette.value = data.palette;
                }
                entityId = data.id || entityId;
                syncNameField();

                const isObject = data.kind === 'object'
                    || data.preset === 'object'
                    || (!data.parts && Array.isArray(data.voxels));
                if (isObject) {
                    currentPreset = getPreset('object');
                    const skObj = loadPresetSkeleton(currentPreset);
                    PART_CONFIG = skObj.cfg;
                    PART_ORDER = skObj.order;
                    jointRotations = emptyJointRotations();
                    if (data.grid) {
                        objectGrid = {
                            x: data.grid.x || 16,
                            y: data.grid.y || 16,
                            z: data.grid.z || data.grid.x || 16,
                        };
                        document.getElementById('sel-object-size').value = String(objectGrid.x);
                        document.getElementById('sel-object-height').value = String(objectGrid.y);
                    }
                    objectVoxels = (data.voxels || []).map((v) => {
                        let c = 0;
                        if (typeof v.c === 'number') c = v.c;
                        else if (v.color) c = nearestIndex(v.color);
                        return {
                            x: Math.round(v.x),
                            y: Math.round(v.y),
                            z: Math.round(v.z),
                            c: Math.max(0, Math.min(31, c | 0)),
                        };
                    }).filter((v) => inObjectBounds(v.x, v.y, v.z));
                    setEntityKind('object', { keepVoxels: true });
                    rebuildObjectMeshes();
                    renderPaletteBoxes();
                    return;
                }

                if (!data.parts) throw new Error('Formato inválido (falta parts o voxels)');

                const presetId = data.preset || 'biped';
                applyCreaturePreset(getPreset(presetId), { keepName: true });
                for (const name of PART_ORDER) {
                    if (!data.parts[name]) continue;
                    const p = data.parts[name];
                    partVoxels[name] = (p.voxels || []).map((v) => {
                        let c = 0;
                        if (typeof v.c === 'number') c = v.c;
                        else if (v.color) c = nearestIndex(v.color);
                        return {
                            x: Math.round(v.x),
                            y: Math.round(v.y),
                            z: Math.round(v.z),
                            c: Math.max(0, Math.min(31, c | 0)),
                        };
                    });
                    if (p.transform) {
                        partTransforms[name] = {
                            pos: { ...p.transform.pos },
                            scale: { ...p.transform.scale },
                        };
                    }
                    rebuildPart(name);
                }
                if (data.animation) Object.assign(jointRotations, data.animation);
                setEntityKind('character');
                updateAllTransforms();
                updateJoints();
                loadTransformSliders();
                renderPaletteBoxes();
                setActivePart(PART_ORDER.includes(activePart) ? activePart : (PART_ORDER[0] || 'torso'));
            } catch (e) {
                alert('Error al cargar: ' + e.message);
            }
        }

        document.getElementById('btn-export').addEventListener('click', exportModel);
        document.getElementById('btn-import').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                importModel(ev.target.result);
                e.target.value = '';
            };
            reader.readAsText(file);
        });

        // =====================================================================
        // NUEVO SISTEMA DE ANIMACIÓN (fotogramas clave + movimiento)
        // =====================================================================

        // Estructura de datos
        let animData = {
            frames: [],       // { t: seconds, type: 'key'|'tween', easing: 'linear'|..., duration: seconds, pose: {} }
            loop: true,
            duration: 2.0,    // duración total (no se encoge por debajo del mínimo)
        };
        let animPlaying = false;
        let animTime = 0;
        let selectedFrameIndex = -1;
        let animSpeed = 1.0;
        const MIN_TIMELINE_S = 2.0;

        // Funciones de easing
        function easeLinear(t) { return t; }
        function easeIn(t) { return t * t; }
        function easeOut(t) { return 1 - (1 - t) * (1 - t); }
        function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
        function easeBounce(t) {
            const n1 = 7.5625, d1 = 2.75;
            if (t < 1 / d1) return n1 * t * t;
            else if (t < 2 / d1) { t -= 1.5 / d1; return n1 * t * t + 0.75; }
            else if (t < 2.5 / d1) { t -= 2.25 / d1; return n1 * t * t + 0.9375; }
            else { t -= 2.625 / d1; return n1 * t * t + 0.984375; }
        }
        function easeElastic(t) {
            const c4 = (2 * Math.PI) / 3;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
        }
        function getEasing(name) {
            const map = {
                linear: easeLinear,
                easeIn: easeIn,
                easeOut: easeOut,
                easeInOut: easeInOut,
                bounce: easeBounce,
                elastic: easeElastic,
            };
            return map[name] || easeLinear;
        }

        function lerpPoseMaps(a, b, k) {
            const out = {};
            const keys = new Set([
                ...Object.keys(a || {}),
                ...Object.keys(b || {}),
                ...Object.keys(jointRotations || {}),
            ]);
            for (const key of keys) {
                const va = (a && a[key]) || 0;
                const vb = (b && b[key]) || 0;
                out[key] = va + (vb - va) * k;
            }
            return out;
        }

        // Ordenar fotogramas por tiempo (la duración solo crece o respeta el mínimo)
        function sortFrames() {
            animData.frames.sort((a, b) => a.t - b.t);
            let end = 0;
            for (const f of animData.frames) {
                end = Math.max(end, f.t);
                if (f.type === 'tween') {
                    end = Math.max(end, f.t + (Number(f.duration) || 0));
                }
            }
            animData.duration = Math.max(end, animData.duration || 0, MIN_TIMELINE_S);
        }

        function playheadTime() {
            const dur = Math.max(animData.duration || MIN_TIMELINE_S, 1e-4);
            let t = Number(animTime) || 0;
            if (animData.loop) {
                t = ((t % dur) + dur) % dur;
            } else {
                t = Math.min(Math.max(t, 0), dur);
            }
            return t;
        }

        // Obtener pose interpolada en un tiempo t
        function getPoseAt(t) {
            if (!animData.frames.length) return { ...jointRotations };
            const frames = animData.frames;
            const dur = Math.max(animData.duration || MIN_TIMELINE_S, 1e-4);
            if (t >= dur) {
                if (animData.loop) t = ((t % dur) + dur) % dur;
                else return { ...(frames[frames.length - 1].pose || {}) };
            }
            if (t <= frames[0].t) return { ...(frames[0].pose || {}) };

            for (let i = 0; i < frames.length; i++) {
                const f0 = frames[i];
                const f1 = frames[i + 1];
                if (!f1) {
                    if (t >= f0.t) {
                        if (f0.type === 'tween') {
                            const span = Math.max(Number(f0.duration) || 0.5, 1e-6);
                            const localT = Math.min((t - f0.t) / span, 1);
                            const eased = getEasing(f0.easing || 'linear')(localT);
                            let prevPose = null;
                            for (let j = i - 1; j >= 0; j--) {
                                if (frames[j].type === 'key') { prevPose = frames[j].pose; break; }
                            }
                            if (!prevPose) return { ...(f0.pose || {}) };
                            return lerpPoseMaps(prevPose, f0.pose, eased);
                        }
                        return { ...(f0.pose || {}) };
                    }
                    continue;
                }
                if (t >= f0.t && t < f1.t) {
                    const span = f1.t - f0.t;
                    if (span <= 1e-8) return { ...(f0.pose || {}) };
                    let localT = (t - f0.t) / span;
                    if (f0.type === 'tween') {
                        localT = getEasing(f0.easing || 'linear')(localT);
                        let prevPose = null;
                        for (let j = i - 1; j >= 0; j--) {
                            if (frames[j].type === 'key') { prevPose = frames[j].pose; break; }
                        }
                        if (!prevPose) prevPose = f0.pose;
                        return lerpPoseMaps(prevPose, f1.pose, localT);
                    }
                    return lerpPoseMaps(f0.pose, f1.pose, localT);
                }
            }
            return { ...(frames[frames.length - 1].pose || {}) };
        }

        // Aplicar pose al personaje
        function applyPose(pose) {
            if (!pose) return;
            Object.assign(jointRotations, pose);
            updateJoints();
            updateRotationSlidersValues();
        }

        // Actualizar la línea de tiempo (canvas)
        function renderTimeline() {
            const canvas = document.getElementById('timeline-canvas');
            if (!canvas) return;
            const cssW = Math.max(1, Math.floor(canvas.clientWidth || 800));
            if (canvas.width !== cssW) canvas.width = cssW;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            const duration = Math.max(animData.duration || MIN_TIMELINE_S, 1e-4);
            const scale = w / duration;
            // Dibujar grid
            ctx.strokeStyle = '#444466';
            ctx.lineWidth = 0.5;
            const step = duration > 4 ? 0.5 : 0.2;
            for (let t = 0; t <= duration + 1e-6; t += step) {
                const x = t * scale;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            // Dibujar fotogramas
            for (let i = 0; i < animData.frames.length; i++) {
                const f = animData.frames[i];
                const x = f.t * scale;
                const isKey = f.type === 'key';
                const isSelected = (i === selectedFrameIndex);
                ctx.fillStyle = isKey ? '#4a9eff' : '#ffaa44';
                if (isSelected) ctx.shadowColor = '#ffffff';
                else ctx.shadowColor = 'transparent';
                ctx.shadowBlur = isSelected ? 10 : 0;
                ctx.beginPath();
                ctx.arc(x, h / 2, isKey ? 8 : 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // Etiqueta de tiempo
                ctx.fillStyle = '#ccd';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(f.t.toFixed(1), x, 14);
            }
            // Playhead (porcentaje del contenedor CSS, no píxeles del canvas interno)
            const playhead = document.getElementById('playhead');
            if (playhead) {
                const pct = (playheadTime() / duration) * 100;
                playhead.style.left = `${pct}%`;
            }
        }

        // Actualizar lista de fotogramas (UI)
        function updateFrameList() {
            const list = document.getElementById('frame-list');
            if (!list) return;
            list.innerHTML = '';
            animData.frames.forEach((f, idx) => {
                const div = document.createElement('div');
                div.style.cssText = `
                    padding: 2px 10px;
                    border-radius: 12px;
                    background: ${idx === selectedFrameIndex ? '#4a9eff' : 'rgba(255,255,255,0.06)'};
                    border: 1px solid ${idx === selectedFrameIndex ? '#4a9eff' : 'rgba(255,255,255,0.1)'};
                    color: ${idx === selectedFrameIndex ? '#fff' : '#aaa'};
                    font-size: 10px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 4px;
                `;
                div.textContent = `${f.t.toFixed(1)}s ${f.type === 'key' ? '🔑' : '➡️'}${f.easing ? ' '+f.easing : ''}`;
                div.addEventListener('click', () => {
                    selectedFrameIndex = idx;
                    updateFrameList();
                    renderTimeline();
                    // Mostrar la pose de este fotograma
                    applyPose(f.pose);
                });
                list.appendChild(div);
            });
        }

        // Añadir fotograma clave (en el tiempo actual)
        function addKeyframe() {
            let t = playheadTime();
            // Si existe un fotograma clave en ese tiempo, reemplazar
            const existing = animData.frames.findIndex(
                (f) => f.type === 'key' && Math.abs(f.t - t) < 0.01,
            );
            const pose = { ...jointRotations };
            const newFrame = { t, type: 'key', pose };
            if (existing >= 0) {
                animData.frames[existing] = newFrame;
            } else {
                animData.frames.push(newFrame);
            }
            // Deja margen después del último key para seguir animando
            animData.duration = Math.max(animData.duration, t + 0.5, MIN_TIMELINE_S);
            sortFrames();
            selectedFrameIndex = animData.frames.findIndex((f) => f === newFrame);
            updateFrameList();
            renderTimeline();
        }

        // Añadir fotograma de movimiento (tween)
        function addTween() {
            let t = playheadTime();
            const duration = parseFloat(document.getElementById('anim-tween-duration').value) || 0.5;
            const easing = document.getElementById('anim-easing').value || 'linear';
            // Buscar el keyframe anterior más cercano
            let prevKey = null;
            for (let i = animData.frames.length - 1; i >= 0; i--) {
                if (animData.frames[i].type === 'key' && animData.frames[i].t <= t + 1e-6) {
                    prevKey = animData.frames[i];
                    break;
                }
            }
            if (!prevKey) {
                alert('Debe existir al menos un fotograma clave antes del punto actual. Scrub la timeline o añade ➕ Clave primero.');
                return;
            }
            // Evitar apilar un tween exactamente encima de otro fotograma
            if (animData.frames.some((f) => Math.abs(f.t - t) < 0.01)) {
                t = t + 0.05;
            }
            const pose = { ...prevKey.pose };
            const newFrame = { t, type: 'tween', duration, easing, pose };
            animData.frames.push(newFrame);
            animData.duration = Math.max(animData.duration, t + duration, MIN_TIMELINE_S);
            sortFrames();
            selectedFrameIndex = animData.frames.findIndex((f) => f === newFrame);
            updateFrameList();
            renderTimeline();
        }

        // Eliminar fotograma seleccionado
        function deleteSelectedFrame() {
            if (selectedFrameIndex < 0 || selectedFrameIndex >= animData.frames.length) return;
            animData.frames.splice(selectedFrameIndex, 1);
            selectedFrameIndex = Math.min(selectedFrameIndex, animData.frames.length - 1);
            sortFrames();
            updateFrameList();
            renderTimeline();
            if (selectedFrameIndex >= 0) {
                applyPose(animData.frames[selectedFrameIndex].pose);
            }
        }

        // Duplicar fotograma seleccionado
        function duplicateFrame() {
            if (selectedFrameIndex < 0 || selectedFrameIndex >= animData.frames.length) return;
            const src = animData.frames[selectedFrameIndex];
            const newT = src.t + 0.1;
            const newFrame = {
                t: newT,
                type: src.type,
                duration: src.duration,
                easing: src.easing,
                pose: { ...src.pose },
            };
            animData.frames.push(newFrame);
            sortFrames();
            selectedFrameIndex = animData.frames.findIndex(f => f === newFrame);
            updateFrameList();
            renderTimeline();
            applyPose(newFrame.pose);
        }

        // Reproducir / pausar
        function togglePlay() {
            animPlaying = !animPlaying;
            document.getElementById('anim-btn-play').textContent = animPlaying ? '⏸' : '▶';
        }

        function stopAnim() {
            animPlaying = false;
            animTime = 0;
            document.getElementById('anim-btn-play').textContent = '▶';
            // Aplicar primer fotograma si existe
            if (animData.frames.length) {
                applyPose(animData.frames[0].pose);
            }
            renderTimeline();
        }

        // Exportar animación (JSON)
        function exportAnimation() {
            if (animData.frames.length < 2) {
                alert('Necesitas al menos 2 fotogramas para exportar una animación.');
                return;
            }
            const id = readEntityName();
            const data = {
                version: '1.0',
                kind: 'animation',
                id: `${id}_anim`,
                model: `assets/entities/${id}.json`,
                duration_s: Math.round(animData.duration * 10000) / 10000,
                loop: animData.loop,
                frames: animData.frames.map(f => ({
                    t: Math.round(f.t * 10000) / 10000,
                    type: f.type,
                    duration: f.type === 'tween' ? Math.round(f.duration * 10000) / 10000 : undefined,
                    easing: f.type === 'tween' ? f.easing : undefined,
                    pose: { ...f.pose }
                }))
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${id}_anim.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadAnimClip(data) {
            animData.frames = (data.frames || [])
                .map((f) => ({
                    t: Number(f.t) || 0,
                    type: f.type === 'tween' ? 'tween' : 'key',
                    duration: f.duration != null ? Number(f.duration) : undefined,
                    easing: f.easing || undefined,
                    pose: { ...(f.pose || {}) },
                }))
                .sort((a, b) => a.t - b.t);
            if (typeof data.loop === 'boolean') {
                animData.loop = data.loop;
                const loopEl = document.getElementById('anim-loop');
                if (loopEl) loopEl.checked = data.loop;
            }
            if (data.duration_s > 0) {
                animData.duration = Math.max(data.duration_s, MIN_TIMELINE_S);
            }
            sortFrames();
            animTime = 0;
            animPlaying = false;
            selectedFrameIndex = animData.frames.length ? 0 : -1;
            const playBtn = document.getElementById('anim-btn-play');
            if (playBtn) playBtn.textContent = '▶';
            updateFrameList();
            renderTimeline();
            if (selectedFrameIndex >= 0) {
                applyPose(animData.frames[selectedFrameIndex].pose);
            }
            const panel = document.getElementById('anim-panel');
            if (panel) panel.style.display = 'flex';
            alert(`Animación "${data.id || '?'}" cargada (${animData.frames.length} fotogramas, modelo: ${data.model || '?'}).`);
        }

        // ------------------------------------------------------------------
        // Eventos del panel de animación
        // ------------------------------------------------------------------
        function setupAnimPanel() {
            // Toggle panel (botón en la barra superior)
            const animToggle = document.createElement('button');
            animToggle.className = 'action-btn';
            animToggle.id = 'btn-anim-toggle';
            animToggle.textContent = '🎬 Anim';
            animToggle.style.marginLeft = '8px';
            document.getElementById('top-bar').appendChild(animToggle);
            animToggle.addEventListener('click', () => {
                const panel = document.getElementById('anim-panel');
                panel.style.display = panel.style.display === 'none' || !panel.style.display ? 'flex' : 'none';
                if (panel.style.display === 'flex') renderTimeline();
            });

            // Controles
            document.getElementById('anim-btn-play').addEventListener('click', togglePlay);
            document.getElementById('anim-btn-stop').addEventListener('click', stopAnim);
            document.getElementById('anim-btn-add-key').addEventListener('click', addKeyframe);
            document.getElementById('anim-btn-add-tween').addEventListener('click', addTween);
            document.getElementById('anim-btn-duplicate').addEventListener('click', duplicateFrame);
            document.getElementById('anim-btn-delete').addEventListener('click', deleteSelectedFrame);
            document.getElementById('anim-btn-export').addEventListener('click', exportAnimation);

            // Velocidad
            const speedSlider = document.getElementById('anim-speed');
            const speedLabel = document.getElementById('anim-speed-label');
            speedSlider.addEventListener('input', () => {
                animSpeed = parseFloat(speedSlider.value);
                speedLabel.textContent = animSpeed.toFixed(1);
            });

            // Loop
            document.getElementById('anim-loop').addEventListener('change', (e) => {
                animData.loop = e.target.checked;
            });

            // Click en la línea de tiempo para mover el cabezal de reproducción
            const timeline = document.getElementById('timeline');
            const scrubToEvent = (e) => {
                const rect = timeline.getBoundingClientRect();
                const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / Math.max(rect.width, 1)));
                const duration = Math.max(animData.duration || MIN_TIMELINE_S, 1e-4);
                animTime = x * duration;
                if (animData.frames.length) {
                    applyPose(getPoseAt(animTime));
                }
                renderTimeline();
            };
            timeline.addEventListener('click', scrubToEvent);

            // Arrastrar el playhead
            let dragging = false;
            timeline.addEventListener('mousedown', (e) => {
                dragging = true;
                scrubToEvent(e);
            });
            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                scrubToEvent(e);
            });
            window.addEventListener('mouseup', () => { dragging = false; });

            // Si se edita un slider de rotación, actualizar el fotograma seleccionado
            for (const slider of Object.values(rotSliders)) {
                if (slider) {
                    slider.addEventListener('input', () => {
                        if (selectedFrameIndex >= 0 && selectedFrameIndex < animData.frames.length) {
                            const frame = animData.frames[selectedFrameIndex];
                            // Actualizar la pose con las rotaciones actuales
                            for (const axis of ['x', 'y', 'z']) {
                                const key = jointKey(activePart, axis);
                                frame.pose[key] = parseFloat(rotSliders[axis].value);
                            }
                            updateFrameList();
                            renderTimeline();
                        }
                    });
                }
            }

            // Inicializar con un fotograma clave por defecto
            if (animData.frames.length === 0) {
                const pose = { ...jointRotations };
                animData.frames.push({ t: 0, type: 'key', pose });
                sortFrames();
                selectedFrameIndex = 0;
                updateFrameList();
                renderTimeline();
            }
        }

        // ------------------------------------------------------------------
        // 14. Loop
        // ------------------------------------------------------------------
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        const clock = new THREE.Clock();
        function render() {
            requestAnimationFrame(render);
            const rawDt = clock.getDelta();
            // Animación walk (si está activa, no interferir)
            if (!animPlaying && walkActive) {
                animateWalk(rawDt);
            }
            // Reproducción de animación
            if (animPlaying) {
                const dur = Math.max(animData.duration || MIN_TIMELINE_S, 1e-4);
                animTime += rawDt * animSpeed;
                if (animData.loop) {
                    animTime = ((animTime % dur) + dur) % dur;
                } else if (animTime >= dur) {
                    animTime = dur;
                    animPlaying = false;
                    document.getElementById('anim-btn-play').textContent = '▶';
                }
                applyPose(getPoseAt(animTime));
                renderTimeline();
            }
            controls.update();
            renderer.render(scene, camera);
        }

        try {
            syncNameField();
            if (currentPreset.kind === 'object') {
                if (currentPreset.grid) {
                    objectGrid = { ...currentPreset.grid };
                    document.getElementById('sel-object-size').value = String(objectGrid.x);
                    document.getElementById('sel-object-height').value = String(objectGrid.y);
                }
                setEntityKind('object');
            } else {
                rebuildPartButtons();
                setEntityKind('character');
                loadTransformSliders();
                updateJoints();
            }
            setupAnimPanel();
        } catch (err) {
            console.error('Init editor:', err);
        }
        render();
    </script>
</body>
</html>
