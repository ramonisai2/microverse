[package]
name = "microverse"
version = "0.2.0"
edition = "2021"

[lib]
name = "microverse"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "microverse"
path = "src/main.rs"

[dependencies]
wgpu = "23"
winit = { version = "0.30", features = ["android-native-activity"] }
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
env_logger = "0.11"
log = "0.4"
noise = "0.9"
rayon = "1.10"
rustc-hash = "2.1"
indexmap = { version = "2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[package.metadata.android]
package = "com.microverse.game"

# Horizontal total: la actividad no rota aunque gires el móvil.
[package.metadata.android.application.activity]
orientation = "landscape"

# Sin barra de estado (reloj/batería): tema fullscreen sin título.
# (winit ignora set_fullscreen en Android — esto es lo que manda.)
[package.metadata.android.application]
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

# Keystore local para el APK release (medición/sideload, NO Play Store).
[package.metadata.android.signing.release]
path = "/home/ramon/.android/microverse-release.keystore"
keystore_password = "microverse123"

