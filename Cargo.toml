[package]
name = "microverse"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "23"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
env_logger = "0.11"
log = "0.4"
noise = "0.9"
rayon = "1.10"
rustc-hash = "2.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

